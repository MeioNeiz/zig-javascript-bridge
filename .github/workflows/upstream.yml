# Watches scottredig/zig-javascript-bridge main. When it moves: fast-forwards this fork's
# `upstream` branch to it, tries rebasing `main` and `meiolol` onto it, builds them, and
# opens (or comments on) an issue labelled `upstream`. Quiet when nothing changed.
name: upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # Re-enables this workflow every run: GitHub turns schedules off after 60 days without
  # repository activity, and upstream can be quiet for longer than that.
  actions: write

concurrency:
  group: upstream

env:
  UPSTREAM: scottredig/zig-javascript-bridge
  MIRROR: upstream
  BRANCHES: main meiolol
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: compare
        run: .github/upstream.sh compare
      - if: steps.compare.outputs.changed == 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.compare.outputs.zig }}
          use-cache: false
      - if: steps.compare.outputs.changed == 'true'
        run: .github/upstream.sh report
      - run: gh api -X PUT repos/$GITHUB_REPOSITORY/actions/workflows/upstream.yml/enable
